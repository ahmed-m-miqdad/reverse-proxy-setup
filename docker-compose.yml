services:


  nginx-proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/error.html:/usr/share/nginx/html/error.html:ro"
      - "./nginx/ssl:/etc/nginx/ssl:ro"
    depends_on:
      - app1_1
      - app1_2
      - app2_1
      - app2_2
      - app3_1
      - app3_2


  app1_1:
    image: nginx:alpine
    volumes:
      - ./apps/app1:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1_2:
    image: nginx:alpine
    volumes:
      - ./apps/app1:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5


  app2_1:
    image: nginx:alpine
    volumes:
      - ./apps/app2:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  app2_2:
    image: nginx:alpine
    volumes:
      - ./apps/app2:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5


  app3_1:
    image: nginx:alpine
    volumes:
      - ./apps/app3:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  app3_2:
    image: nginx:alpine
    volumes:
      - ./apps/app3:/usr/share/nginx/html:ro
